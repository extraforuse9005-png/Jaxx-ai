name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android folder
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --org com.jaxxai --project-name jaxx_ai --platforms=android .
          mv -f pubspec.yaml.bak pubspec.yaml

      - name: Set package name, label and internet permission
        run: |
          sed -i 's/applicationId = ".*"/applicationId = "com.jaxxai.assistant"/' android/app/build.gradle.kts || true
          sed -i "s/applicationId \".*\"/applicationId \"com.jaxxai.assistant\"/" android/app/build.gradle || true
          sed -i 's/android:label="[^"]*"/android:label="JAXX AI"/' android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.INTERNET"/>|' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jaxx-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
