name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android folder
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create --org com.jaxxai --project-name jaxx_ai --platforms=android .
          mv -f pubspec.yaml.bak pubspec.yaml

      - name: Set package name and label
        run: |
          sed -i 's/applicationId = ".*"/applicationId = "com.jaxxai.assistant"/' android/app/build.gradle.kts || true
          sed -i "s/applicationId \".*\"/applicationId \"com.jaxxai.assistant\"/" android/app/build.gradle || true
          sed -i 's/android:label="[^"]*"/android:label="JAXX AI"/' android/app/src/main/AndroidManifest.xml

      - name: Add permissions and app queries
        run: |
          python3 - << 'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          add = ''
          for perm in ['INTERNET', 'RECORD_AUDIO']:
              if 'android.permission.' + perm not in s:
                  add += '    <uses-permission android:name="android.permission.' + perm + '"/>\n'
          if '<queries>' not in s:
              add += '''    <queries>
              <intent>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
              </intent>
              <intent>
                  <action android:name="android.intent.action.VIEW"/>
                  <data android:scheme="https"/>
              </intent>
              <intent>
                  <action android:name="android.speech.RecognitionService"/>
              </intent>
              <intent>
                  <action android:name="android.intent.action.TTS_SERVICE"/>
              </intent>
          </queries>
          '''
          s = s.replace('<application', add + '    <application', 1)
          open(p, 'w').write(s)
          PY

      - name: Install native JAXX code
        run: |
          F=$(find android/app/src/main/kotlin -name MainActivity.kt | head -n 1)
          PKG=$(grep '^package ' "$F" | awk '{print $2}')
          sed "s/__PACKAGE__/$PKG/" native/MainActivity.kt > "$F"
          echo "Native code written for package: $PKG"

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jaxx-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
